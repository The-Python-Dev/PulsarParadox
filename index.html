<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0D17" />

    <!-- Primary SEO (overridden per-page via React Helmet or meta tags) -->
    <title>PulsarParadox — The Founder's Toolkit | Web Dev · Copy · SEO</title>
    <meta name="description" content="One-person digital studio building websites, writing copy, and engineering growth for founders. Agency quality, freelancer speed." />
    <meta name="author" content="PulsarParadox" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PulsarParadox — The Founder's Toolkit" />
    <meta property="og:description" content="One-person digital studio. Websites, copy, SEO. Agency quality. Freelancer speed." />
    <meta property="og:url" content="https://pulsarparadox.netlify.app" />
    <meta property="og:site_name" content="PulsarParadox" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PulsarParadox — The Founder's Toolkit" />
    <meta name="twitter:description" content="One-person digital studio. Websites, copy, SEO. Agency quality. Freelancer speed." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <!-- Font Preloads (prevent FOUT) -->
    <!-- Google Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fontshare preconnect -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <!-- Geist Mono CDN preconnect -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />

    <!-- Canonical -->
    <link rel="canonical" href="https://pulsarparadox.netlify.app" />
  </head>
  <body>
    <!-- Netlify Forms detection — hidden form so build bot registers the schema -->
    <!-- Do NOT remove: without this, form submissions on /contact will 404 -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="projectType" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
