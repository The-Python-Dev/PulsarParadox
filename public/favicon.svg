<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0D0D17"/>

  <!-- { brace left (violet) -->
  <text x="4" y="46" font-family="system-ui, sans-serif" font-size="40" font-weight="700" fill="#8B5CF6">{</text>

  <!-- ∞ infinity (cyan) -->
  <text x="18" y="46" font-family="system-ui, sans-serif" font-size="28" font-weight="400" fill="#22D3EE">∞</text>

  <!-- } brace right (violet) -->
  <text x="46" y="46" font-family="system-ui, sans-serif" font-size="40" font-weight="700" fill="#8B5CF6">}</text>
</svg>